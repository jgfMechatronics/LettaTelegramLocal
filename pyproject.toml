[project]
name = "LettaTelegramLocal"
version = "0.1.0"
description = "Telegram bridge for Letta agents"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "requests>=2.28.0",
    "pytz>=2024.1",
    "python-dotenv>=1.0.0",
    "python-telegram-bot[job-queue]>=22.0",
]

[project.scripts]
letta-telegram = "LettaTelegramLocal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
