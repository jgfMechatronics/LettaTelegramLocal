[project]
name = "LettaTelegramLocal"
version = "0.2.0"
description = "Telegram bridge for Agent Home agents"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=22.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
letta-telegram = "LettaTelegramLocal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"